name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    name: Studio / macOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: PortCore tests
        run: swift test --package-path macOS/NXPortStudio
      - name: Studio build
        run: swift build --package-path macOS/NXPortStudio
      - name: Package release and verify its contents
        run: |
          bash macOS/NXPortStudio/scripts/package_app.sh "${{ runner.temp }}/NX Port Studio.app"
          python3 tools/maintainers/check_studio_package.py "${{ runner.temp }}/NX Port Studio.app"
  tools:
    name: Asset-free Python checks
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Documentation and source-only tool tests
        run: >-
          python -m unittest
          dm.tools.tests.test_docs
          dm.tools.tests.test_patches
          dm.tools.tests.test_nsp_heap_check
          dm.tools.tests.test_game_inputs
          dm.tools.tests.test_nextendo_services
          dm.tools.tests.test_nextendo_local_peers
          dm.tools.tests.test_env_switches
          dm.tools.tests.test_nextendo_patches
          dm.tools.tests.test_nextendo_renewal
          dm.tools.tests.test_dotnet_environment
          dm.tools.tests.test_nsp_nsz
          dm.tools.tests.test_nso_syms
          dm.tools.tests.test_system_data
          dm.tools.tests.test_personal_miis
          dm.tools.tests.test_nsp_mac_app
          dm.tools.tests.test_launcher_settings
          dm.tools.tests.test_display_mods
          dm.ios.tests.test_launcher_storage
          dm.ios.tests.test_mobile_nextendo
          dm.ios.tests.test_game_account_preparation
          dm.ios.tests.test_nextendo_resources
          dm.ios.tests.test_nextendo_embed
          tools.maintainers.test_prepare_export
      - name: Display geometry and build policy / synthetic modules
        run: make -C dm/host/tests display display-sanitize
      - name: JKSV ZIP interoperability and atomic save restore
        run: |
          python3 dm/host/tests/test_save_archives.py
          DM_SAVE_ARCHIVE_SANITIZE=1 python3 dm/host/tests/test_save_archives.py
      - name: Native save controls / both Apple SDKs
        run: |
          xcrun swiftc -typecheck -swift-version 5 -target arm64-apple-macos26.0 -import-objc-header dm/host/save_archive.h dm/mac/Launcher.swift dm/mac/GameAccount.swift macOS/NXPortStudio/Sources/PortCore/NextendoAccount.swift macOS/NXPortStudio/Sources/PortCore/NextendoLoopback.swift dm/ios/Sources/LauncherSettings.swift dm/ios/Sources/LauncherRow.swift dm/ios/Sources/LauncherLocalization.swift dm/ios/Sources/LauncherSavesView.swift
          xcrun --sdk iphoneos swiftc -typecheck -swift-version 5 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios26.0 -import-objc-header dm/ios/Sources/DmIOS-Bridging-Header.h dm/ios/Sources/LauncherLocalization.swift dm/ios/Sources/LauncherSavesView.swift
      - name: Personal Mii database / synthetic records and sanitizers
        run: make -C dm/host/tests GAME=0100152000022000 mii mii-sanitize
  networking:
    name: Local network fixtures / macOS
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Discovery transport and sanitizers
        run: python3 tools/maintainers/ci_network_checks.py discovery
      - name: Discovery relay and sanitizers
        run: python3 tools/maintainers/ci_network_checks.py relay
      - name: Local play-history service and sanitizers
        run: python3 tools/maintainers/ci_network_checks.py friends-history
      - name: Native account, social API and signed-code fixtures
        run: >-
          make -C dm/host/tests GAME=0100152000022000
          nextendo-account nextendo-account-sanitize
          nextendo-api nextendo-api-sanitize nextendo-social nextendo-social-sanitize nro
          nsd nsd-sanitize
      - name: Install private-PKI fixture command
        run: brew install openssl@4
      - name: Scoped routing and strict private-PKI verification
        run: >-
          make -C dm/host/tests
          nextendo-routes nextendo-routes-sanitize nextendo-x509 nextendo-x509-sanitize
  firmware-tools:
    name: Firmware parser / synthetic data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Bounded firmware resource extraction
        run: dotnet run --project dm/tools/tests/friends_firmware_fixture/FriendsFirmwareTests.csproj --configuration Release
      - name: Read-only game container identification
        run: dotnet run --project dm/tools/tests/container_identity_fixture/ContainerIdentityTests.csproj --configuration Release
